fint:
  application-id: fint-flyt-mapping-service

novari:
  flyt:
    mapping-service:
      kafka:
        event:
          instance-processing-events-retention-time: "4d"

logging:
  level:
    no.novari.cache.ehcache.FintEhCacheEventLogger: WARN

spring:
  profiles:
    include:
      - flyt-kafka
      - flyt-logging
      - flyt-intgr-conf-client

  output:
    ansi:
      enabled: always
