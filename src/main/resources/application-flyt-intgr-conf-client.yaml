spring:
  security:
    oauth2:
      client:
        provider:
          fint-idp:
            token-uri: https://idp.felleskomponent.no/nidp/oauth/nam/token?resourceServer=fint-api
        registration:
          intgr-conf-service:
            authorization-grant-type: client_credentials
            provider: fint-idp
            client-id: ${fint.sso.client-id}
            client-secret: ${fint.sso.client-secret}
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s
