apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ra-no

resources:
  - ../../../base

labels:
  - pairs:
      app.kubernetes.io/instance: fint-flyt-mapping-service_ra_no
      fintlabs.no/org-id: ra.no

patches:
  - patch: |-
      # ra-no gets the authorization client from 1Password, with other key names.
      - op: replace
        path: "/spec/env/1/valueFrom/secretKeyRef/key"
        value: "fint.flyt.authorization.sso.client-id"
      - op: replace
        path: "/spec/env/2/valueFrom/secretKeyRef/key"
        value: "fint.flyt.authorization.sso.client-secret"
      - op: replace
        path: "/spec/kafka/acls/0/topic"
        value: "ra-no.flyt.*"
      - op: replace
        path: "/spec/orgId"
        value: "ra.no"
      - op: add
        path: "/spec/env/-"
        value:
          name: "novari.kafka.topic.orgId"
          value: "ra-no"
      - op: add
        path: "/spec/env/-"
        value:
          name: "novari.flyt.mapping-service.intgr-conf-client.base-url"
          value: "http://fint-flyt-intgr-conf-service:8080/beta/ra-no"
    target:
      kind: Application
      name: fint-flyt-mapping-service
