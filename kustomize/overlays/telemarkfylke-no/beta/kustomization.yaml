apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: telemarkfylke-no

resources:
  - ../../../base

labels:
  - pairs:
      app.kubernetes.io/instance: fint-flyt-mapping-service_telemarkfylke_no
      fintlabs.no/org-id: telemarkfylke.no

patches:
  - patch: |-
      - op: replace
        path: "/spec/kafka/acls/0/topic"
        value: "telemarkfylke-no.flyt.*"
      - op: replace
        path: "/spec/orgId"
        value: "telemarkfylke.no"
      - op: add
        path: "/spec/env/-"
        value:
          name: "novari.kafka.topic.orgId"
          value: "telemarkfylke-no"
      - op: add
        path: "/spec/env/-"
        value:
          name: "novari.flyt.mapping-service.intgr-conf-client.base-url"
          value: "http://fint-flyt-intgr-conf-service:8080/beta/telemarkfylke-no"
    target:
      kind: Application
      name: fint-flyt-mapping-service
